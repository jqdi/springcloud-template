# 灰度路由配置（合并 developer 与 gray 两个模块）
# 通过 gray.mode 切换路由策略：
#   developer = 开发调试路由，将开发者请求路由到本地实例（原 developer 模块）
#   release   = 灰度发布路由，按版本号泳道隔离（原 gray 模块）
# 多环境以 '---' 分开
---
# dev环境配置
spring:
  config:
    activate:
      on-profile: dev
# 灰度路由配置（dev 环境启用 developer 模式，用于本地联调）
gray:
  enabled: true
  mode: developer
  # developer 模式：从这些请求头中提取开发者标识
  developer-headers: x-deviceid,Authorization
  # developer 模式：开发者标识在实例 metadata 中的字段名
  developer-metadata-key: developer

---
# test环境配置
spring:
  config:
    activate:
      on-profile: test
# 灰度路由配置（test 环境启用 developer 模式，用于本地联调）
gray:
  enabled: true
  mode: developer
  developer-headers: x-deviceid,Authorization
  developer-metadata-key: developer

---
# pre环境配置
spring:
  config:
    activate:
      on-profile: pre
# 灰度路由配置（pre 环境启用 release 模式，做小流量灰度验证）
gray:
  enabled: true
  mode: release
  headers: x-gray-version
  version-metadata-key: version
  weight-metadata-key: weight
  default-weight: 100
  fallback-to-baseline: true
  # 染色规则（按顺序匹配，命中第一个即染色）
  # 注意：染色规则建议放配置中心（Nacos/Apollo）动态管理，此处仅为示例
  dye-rules:
    # 规则1：VIP 用户路由到 v2
    - type: header
      header-name: x-user-type
      header-value: vip
      version: v2
    # 规则2：白名单用户路由到 v2
    - type: whitelist
      user-header: x-user-id
      user-ids: 1001,1002,1005
      version: v2
    # 规则3：5% 流量路由到 v2
    - type: percent
      percent: 5
      version: v2

---
# prod环境配置
spring:
  config:
    activate:
      on-profile: prod,prod-zone1,prod-zone2
# 灰度路由配置（prod 环境启用 release 模式，灰度发布）
gray:
  enabled: true
  mode: release
  headers: x-gray-version
  version-metadata-key: version
  weight-metadata-key: weight
  default-weight: 100
  fallback-to-baseline: true
  # 染色规则（按顺序匹配，命中第一个即染色）
  # 注意：染色规则建议放配置中心（Nacos/Apollo）动态管理，此处仅为示例
  dye-rules:
    # 规则1：VIP 用户路由到 v2
    - type: header
      header-name: x-user-type
      header-value: vip
      version: v2
    # 规则2：白名单用户路由到 v2
    - type: whitelist
      user-header: x-user-id
      user-ids: 1001,1002,1005
      version: v2
    # 规则3：5% 流量路由到 v2
    - type: percent
      percent: 5
      version: v2
