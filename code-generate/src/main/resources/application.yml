spring:
  config:
    import: classpath:bootstrap.yml # 在Spring Boot 2.7.x版本中，默认情况下，bootstrap.yml件不再被自动加载
  profiles:
    include: threadpool,feign,resilience4j,sentinel,redis,rabbitmq,rocketmq,messagedriven,cachemanager,datasource,canal # 项目中增加配置application-*.yml可覆盖boot-starter-*,framework的默认配置application-*.yml
  main:
    allow-bean-definition-overriding: true

logging:
  #为了避免日志目录生成{APP_NAME}_IS_UNDEFINED目录，不能使用默认配置logback.xml或logback-spring.xml命名，详细参考：http://www.itersblog.com/archives/5.html
  config: classpath:logback-conf.xml
  file:
    #日志文件目录。./表示相对于项目根目录，即项目根目录下的logs目录。也可配置绝对路径，如：/home/webapp/logs
    path: ./logs/${spring.application.name}

template:
  sequence:
    datacenterId: 1

# 代码生成配置
code:
  generate:
    # 默认生成到adminapi模块
    target-module: tool
    # 可选值: adminapi, admin, system, order, user, tool等
    module-options: adminapi,admin,system,order,user,tool
    # 输出路径前缀，默认为项目根目录
    output-base-path: ../