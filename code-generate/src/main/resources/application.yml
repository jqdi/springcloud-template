spring:
  config:
    import: classpath:bootstrap.yml # 在Spring Boot 2.7.x版本中，默认情况下，bootstrap.yml件不再被自动加载
  profiles:
    include: gracefulresponse,developer,threadpool,feign,resilience4j,sentinel,redis,rabbitmq,rocketmq,messagedriven,cachemanager,datasource,canal # 项目中增加配置application-*.yml可覆盖boot-starter-*,framework的默认配置application-*.yml
  main:
    allow-bean-definition-overriding: true
  cloud:
    loadbalancer:
      eager-load: # spring-cloud-commons-3.1.8 没有eager-load，参考spring cloud高版本实现饥饿加载
        clients: template-tool, template-user

template:
  sequence:
    datacenterId: 1

# 代码生成配置
code:
  generate:
    # 模块
    moduleName: order
    # 输出路径前缀，默认为项目根目录
    output-base-path: ../
